<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Probador SneakerStore</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111;color:white;font:14px system-ui;overflow:hidden}
    video,canvas{position:absolute;width:100%;height:100%;inset:0}video{object-fit:cover}canvas{touch-action:none}
    #status{position:absolute;top:16px;left:16px;right:16px;padding:12px 16px;background:#171717dc;border-radius:14px;pointer-events:none;line-height:1.5}
    #controls{position:absolute;bottom:16px;left:16px;right:16px;padding:14px;background:#171717ed;border-radius:18px;display:grid;gap:10px}
    button{background:#ff6b35;border:0;border-radius:10px;padding:12px;color:#111;font:inherit;font-weight:700}
    button:disabled{opacity:.5}label{display:flex;align-items:center;gap:12px}input{flex:1;min-width:0;accent-color:#ff6b35}
    small{color:#ddd;line-height:1.4}#manualControls{display:none}#manualControls label{margin:8px 0}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script>
    window.addEventListener('error', function () {
      const status = document.getElementById('status');
      if (status) status.textContent = 'No se pudo cargar el motor 3D. Actualiza Android System WebView y vuelve a entrar.';
    });
  </script>
</head>
<body>
  <video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas>
  <div id="status" role="status" aria-live="polite">Preparando modelo 3D…</div>
  <div id="controls">
    <small>Vista aproximada de apariencia. No mide tu talla.</small>
    <button id="start" disabled>Activar cámara</button>
    <button id="mode" hidden>Ajustar manualmente</button>
    <div id="manualControls">
      <small>Modo manual: arrastra cada zapatilla para colocarla sobre tu pie.</small>
      <label>Tamaño <input id="scale" type="range" min="0.4" max="2" step="0.02" value="1"></label>
      <label>Giro <input id="rotation" type="range" min="-180" max="180" value="0"></label>
    </div>
  </div>
  <script type="module" src="./try_on.js"></script>
</body>
</html>
