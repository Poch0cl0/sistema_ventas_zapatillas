<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Probador SneakerStore</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111;color:white;font:14px system-ui;overflow:hidden}
    video,canvas{position:absolute;width:100%;height:100%;inset:0}video{object-fit:cover;z-index:0}canvas{touch-action:none;z-index:1}
    #status{position:absolute;top:8px;left:8px;right:8px;padding:8px 12px;background:#171717dc;border-radius:14px;pointer-events:none;line-height:1.3;font-size:12px}
    #status{z-index:2}#controls{position:absolute;z-index:2;bottom:8px;left:8px;right:8px;padding:12px;background:#171717ed;border-radius:18px;display:grid;gap:8px;max-height:42%;overflow:auto}
    .row{display:flex;gap:8px}.row button{flex:1}button[aria-pressed="true"]{outline:2px solid white}select{font:inherit;padding:8px;border-radius:8px}label span{min-width:65px}
    button{background:#ff6b35;border:0;border-radius:10px;padding:12px;color:#111;font:inherit;font-weight:700}
    button:disabled{opacity:.5}label{display:flex;align-items:center;gap:12px}input{flex:1;min-width:0;accent-color:#ff6b35}
    small{color:#ddd;line-height:1.4}#manualControls{display:none}#manualControls label{margin:8px 0}
    summary{cursor:pointer;padding:10px 0;font-weight:600}input[type=range]{height:26px}#controls button{padding:9px;font-size:13px}#manualControls label{font-size:13px;margin:4px 0}#manualControls select{padding:4px}details{border-top:1px solid #ffffff30}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script>
    window.addEventListener('error', function () {
      const status = document.getElementById('status');
      if (status) status.textContent = 'No se pudo cargar el motor 3D. Actualiza Android System WebView y vuelve a entrar.';
    });
  </script>
</head>
<body>
  <video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas>
  <div id="status" role="status" aria-live="polite">Preparando modelo 3D…</div>
  <div id="controls">
    <button id="start" disabled>Activar cámara</button>
    <button id="mode" hidden aria-pressed="false">Activar tracking automático (experimental)</button>
    <div id="manualControls">
      <div class="row"><label>Pie <select id="selected"><option value="0">Izquierdo</option><option value="1">Derecho</option></select></label><button id="flip">Voltear modelo</button></div>
      <label>Tamaño <input id="scale" type="range" min="0.15" max="3" step="0.01" value="1"></label>
      <label>Giro <input id="rotation" type="range" min="-180" max="180" value="0"></label>
      <details><summary>Posición e inclinación</summary>
      <label>Horizontal <input id="positionX" type="range" min="-50" max="50" step="0.5" value="-19"></label>
      <label>Vertical <input id="positionY" type="range" min="-50" max="50" step="0.5" value="18"></label>
      <label>Inclinación <input id="tilt" type="range" min="-180" max="180" value="0"></label>
      <small>Si ves la suela, pulsa Voltear modelo. Vista aproximada; no mide tu talla.</small>
      </details>
      <div class="row"><button id="freeze">Congelar cámara</button><button id="reset">Recentrar ambas</button></div>
    </div>
  </div>
  <script type="module" src="./try_on.js"></script>
</body>
</html>
