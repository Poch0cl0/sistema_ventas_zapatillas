name: sneakerstore
description: "Aplicación Android SneakerStore para clientes y administradores."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  model_viewer_plus: 1.10.0
  file_picker: 13.1.0
  visibility_detector: 0.4.0+2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/images/
    - assets/try_on/
    - assets/try_on/models/
    - assets/try_on/vendor/
